# GoReleaser config (IN-08). Prepared for downloadable binaries after v1;
# publishing is disabled. `task release:check` validates it and builds a local
# snapshot into dist/.
version: 2

project_name: ygg

before:
  hooks:
    - task build:web

builds:
  - id: ygg
    main: ./cmd/ygg
    binary: ygg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: ygg
    ids: [ygg]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Release notes come from docs/CHANGELOG.md, not from commits.
changelog:
  disable: true

# Never publish until downloadable binaries are switched on after v1.
release:
  disable: true
