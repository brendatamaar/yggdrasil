# Go types -> TypeScript (docs/AGENTS.md 5.8). Run with `task generate`.
# tygo writes one file per Go package; never edit the output by hand.
#
# type_mappings are per package. A Go type from another package that has no
# mapping becomes `any`, which would hide breaking changes: map every
# cross-package type to its qualified name, and import that package in the
# frontmatter.
packages:
  - path: github.com/brendatamaar/yggdrasil/internal/core
    output_path: web/src/api/gen/core.gen.ts
    type_mappings: &std
      time.Time: string
      json.RawMessage: unknown
  - path: github.com/brendatamaar/yggdrasil/internal/agents
    output_path: web/src/api/gen/agents.gen.ts
    # Go-only files: the Adapter and Run interfaces and StartOptions, and the
    # runner (EventSink, Result with an error field, Node).
    exclude_files:
      - adapter.go
      - runner.go
    type_mappings: *std
  - path: github.com/brendatamaar/yggdrasil/internal/api
    output_path: web/src/api/gen/api.gen.ts
    # Go-only files: the closed topic type (topics cross the wire as
    # strings), the server wiring (Deps, Server) and the per-area service
    # interfaces with their routes (the DTOs are in types_<area>.go).
    exclude_files:
      - topic.go
      - server.go
      - repos.go
      - repos_actions.go
      - repos_status.go
      - repos_detail.go
      - builds.go
      - hosts.go
      - search.go
      - stubs.go
      - worktrees.go
      - proposals.go
      - trust.go
      - board.go
      - composer.go
      - mcp.go
      - tasks_service.go
      - hubadapter.go
    frontmatter: |
      import type * as agents from "./agents.gen";
      import type * as core from "./core.gen";
    type_mappings:
      time.Time: string
      json.RawMessage: unknown
      core.ProjectID: core.ProjectID
      core.RepoID: core.RepoID
      core.TaskMode: core.TaskMode
      core.TaskID: core.TaskID
      core.BuildID: core.BuildID
      core.WorktreeID: core.WorktreeID
      core.WorktreeStatus: core.WorktreeStatus
      core.ProposalID: core.ProposalID
      core.ChangeSetID: core.ChangeSetID
      core.ProposalKind: core.ProposalKind
      core.ProposalStatus: core.ProposalStatus
      core.BuildStatus: core.BuildStatus
      core.StepStatus: core.StepStatus
      core.StepOutcome: core.StepOutcome
      core.TaskStatus: core.TaskStatus
      core.Task: core.Task
      agents.Event: agents.Event
